name: Press Run
on:
  schedule:
    - cron: "30 19 * * *"        # 1:00 AM IST nightly
    - cron: "30 20 * * *"        # 2:00 AM IST nightly
    - cron: "30 21 * * *"        # 3:00 AM IST nightly
  workflow_dispatch:            # lets you press "Run workflow" by hand

jobs:
  press:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type
        run: pip install requests beautifulsoup4 lxml

      - name: Run the press
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python scraper.py

      - name: Commit the edition
        run: |
          git config user.name "press-bot"
          git config user.email "press-bot@users.noreply.github.com"
          git add news.json claude_cache.json
          git commit -m "🗞️ press run $(date -u '+%d %b %H:%M')" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 8
          done
